<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NKS Coaching Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#f0f4f8;color:#333;line-height:1.5}
.container{max-width:1000px;margin:0 auto;padding:0 15px}
.navbar{background:linear-gradient(135deg,#0f4c81,#1e88e5);color:#fff;padding:22px 0;text-align:center}
.navbar h1{font-size:2rem}
.banner,.card-box{background:#fff;padding:20px;margin:20px 0;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.banner{text-align:center;border-left:5px solid #1e88e5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-top:15px}
.card{background:#fff;padding:18px;border-radius:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.08);border-top:4px solid #1e88e5;display:flex;flex-direction:column;justify-content:space-between}
.card h3{color:#0f4c81;margin-bottom:8px;font-size:1.1rem}
.badge{display:inline-block;background:#e3f2fd;color:#0f4c81;padding:3px 10px;border-radius:12px;font-size:0.8rem;font-weight:bold;margin-bottom:12px}
.ch-item{background:#f8fafc;padding:15px;border-radius:8px;border:1px solid #cbd5e1;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.ch-item h4{color:#0f4c81;margin-bottom:6px;font-size:1rem}
.live{color:#16a34a;font-size:0.8rem;font-weight:bold;display:block;margin-bottom:8px}
.soon{color:#64748b;font-size:0.8rem;display:block;margin-bottom:8px}
button{cursor:pointer;border:none;border-radius:6px;padding:10px;font-size:0.9rem;font-weight:600;width:100%}
.btn-p{background:#1e88e5;color:#fff}
.btn-l{background:#16a34a;color:#fff}
.btn-s{background:#e2e8f0;color:#475569}
.btn-b{background:#0f4c81;color:#fff;width:auto;padding:8px 16px;margin-bottom:15px}
.hidden{display:none!important}
footer{text-align:center;padding:20px;color:#64748b;font-size:0.85rem}
</style>
</head>
<body>

<header class="navbar">
  <div class="container">
    <h1>NKS Coaching Center</h1>
    <p>कक्षा 1 से 10 तक - ऑनलाइन चैप्टर-वाइज टेस्ट सीरीज</p>
  </div>
</header>

<main class="container">
  <section id="v1">
    <div class="banner">
      <h2>अपनी कक्षा चुनें (Select Your Class)</h2>
      <p>टेस्ट देने के लिए नीचे दी गई कक्षाओं में से अपनी कक्षा चुनें</p>
    </div>
    <div class="grid" id="c-grid"></div>
  </section>

  <section id="v2" class="hidden">
    <div class="card-box">
      <button class="btn-b" onclick="show('v1')">← सभी कक्षाओं पर वापस जाएँ</button>
      <h2 id="c-title" style="color:#0f4c81"></h2>
      <div class="grid" id="s-grid"></div>
    </div>
  </section>

  <section id="v3" class="hidden">
    <div class="card-box">
      <button class="btn-b" id="back-sub">← विषयों पर वापस जाएँ</button>
      <h2 id="s-title" style="color:#0f4c81"></h2>
      <div class="grid" id="ch-grid"></div>
    </div>
  </section>

  <section id="v4" class="hidden">
    <div class="card-box">
      <button class="btn-b" id="back-ch">← पाठों पर वापस जाएँ</button>
      <h2 id="ch-title" style="color:#0f4c81"></h2>
      <div class="grid" id="t-grid"></div>
    </div>
  </section>
</main>

<footer><p>© 2026 NKS Coaching Center. All Rights Reserved.</p></footer>

<script>
const c10 = {
  "हिंदी (Hindi)": { 
    p: "c10_hin", 
    ch: [
      "गद्य 1: मित्रता - आचार्य रामचन्द्र शुक्ल",
      "गद्य 2: ममता - जयशंकर प्रसाद",
      "गद्य 3: क्या लिखें? - पदुमलाल पुन्नालाल बख्शी",
      "गद्य 4: भारतीय संस्कृति - डॉ० राजेन्द्र प्रसाद",
      "गद्य 5: ईर्ष्या, तू न गयी मेरे मन से - रामधारी सिंह दिनकर",
      "गद्य 6: अजन्ता - भगवतशरण उपाध्याय",
      "गद्य 7: पानी में चंदा और चाँद पर आदमी - जयप्रकाश भारती",
      "काव्य 1: सूरदास",
      "काव्य 2: तुलसीदास",
      "काव्य 3: रसखान",
      "काव्य 4: बिहारी",
      "काव्य 5: सुमित्रानन्दन पन्त",
      "काव्य 6: महादेवी वर्मा",
      "काव्य 7: रामनरेश त्रिपाठी",
      "काव्य 8: माखनलाल चतुर्वेदी",
      "काव्य 9: सुभद्राकुमारी चौहान",
      "काव्य 10: मैथिलीशरण गुप्त",
      "काव्य 11: केदारनाथ सिंह",
      "काव्य 12: अशोक वाजपेयी",
      "काव्य 13: श्री श्यामनारायण पाण्डेय",
      "संस्कृत 1: वाराणसीः",
      "संस्कृत 2: अन्योक्तिविलासः",
      "संस्कृत 3: वीरः वीरेण पूज्यते",
      "संस्कृत 4: प्रबुद्धो ग्रामीणः",
      "संस्कृत 5: देशभक्तः चन्द्रशेखरः",
      "संस्कृत 6: केन किं वर्धते?",
      "संस्कृत 7: छान्दोग्य उपनिषद् षष्ठोऽध्यायः",
      "संस्कृत 8: भारतीय संस्कृतिः",
      "संस्कृत 9: जीवन-सूत्राणि",
      "हिंदी व्याकरण एवं काव्य सौन्दर्य"
    ] 
  },
  "गणित (Maths)": { p: "c10_math", ch: ["1. वास्तविक संख्याएँ","2. बहुपद","3. दो चर वाले रैखिक समीकरण","4. द्विघात समीकरण","5. समांतर श्रेढ़ियाँ","6. त्रिभुज","7. निर्देशांक ज्यामिति","8. त्रिकोणमिति का परिचय","9. त्रिकोणमिति के अनुप्रयोग","10. वृत्त","11. वृत्तों से संबंधित क्षेत्रफल","12. पृष्ठीय क्षेत्रफल और आयतन","13. सांख्यिकी","14. प्रायिकता"] },
  "विज्ञान (Science)": { p: "c10_sci", ch: ["1. रासायनिक अभिक्रियाएँ","2. अम्ल, क्षारक एवं लवण","3. धातु एवं अधातु","4. कार्बन एवं यौगिक","5. जैव प्रक्रम","6. नियंत्रण एवं समन्वय","7. जीव जनन कैसे करते हैं","8. आनुवंशिकता","9. प्रकाश - परावर्तन व अपवर्तन","10. मानव नेत्र","11. विद्युत","12. विद्युत धारा के चुंबकीय प्रभाव","13. हमारा पर्यावरण"] },
  "सामाजिक विज्ञान (SST)": { p: "c10_sst", ch: ["इतिहास 1: यूरोप में राष्ट्रवाद","इतिहास 2: भारत में राष्ट्रवाद","इतिहास 3: भूमंडलीकृत विश्व","इतिहास 4: औद्योगीकरण का युग","इतिहास 5: मुद्रण संस्कृति","भूगोल 1: संसाधन एवं विकास","भूगोल 2: वन एवं वन्यजीव","भूगोल 3: जल संसाधन","भूगोल 4: कृषि","भूगोल 5: खनिज व ऊर्जा","भूगोल 6: विनिर्माण उद्योग","भूगोल 7: राष्ट्रीय अर्थव्यवस्था","नागरिक 1: सत्ता की साझेदारी","नागरिक 2: संघवाद","नागरिक 3: जाति, धर्म और लैंगिक मसले","नागरिक 4: राजनीतिक दल","नागरिक 5: लोकतंत्र के परिणाम","अर्थशास्त्र 1: विकास","अर्थशास्त्र 2: अर्थव्यवस्था के क्षेत्रक","अर्थशास्त्र 3: मुद्रा और साख","अर्थशास्त्र 4: वैश्वीकरण","अर्थशास्त्र 5: उपभोक्ता अधिकार"] },
  "अंग्रेजी (English)": { p: "c10_eng", ch: ["1. A Letter to God","2. Nelson Mandela","3. Two Stories About Flying","4. From the Diary of Anne Frank","5. Glimpses of India","6. Madam Rides the Bus","7. The Sermon at Benares","8. Poetry Section","9. A Triumph of Surgery","10. The Thief Story","11. Footprints Without Feet","12. The Necklace and Bholi","13. English Grammar"] },
  "कला व कंप्यूटर": { p: "c10_art", ch: ["कला 1: आलेखन कला","कला 2: प्राविधिक कला","कला 3: स्मृति चित्रण","कंप्यूटर 1: संचार","कंप्यूटर 2: लिनक्स","कंप्यूटर 3: बाइनरी व गेट्स","कंप्यूटर 4: C प्रोग्रामिंग"] }
};

const jrSub = [
  { n: "हिंदी (Hindi)", c: "hin" },
  { n: "अंग्रेजी (English)", c: "eng" },
  { n: "गणित (Maths)", c: "math" },
  { n: "विज्ञान / पर्यावरण", c: "sci" },
  { n: "सामाजिक विज्ञान / GK", c: "sst" }
];

const uploaded = ["c10_hin_ch21_t1.html", "c10_hin_ch21_t2.html", "c10_hin_ch21_t3.html", "c10_hin_ch22_t1.html", "c10_hin_ch22_t2.html", "c10_hin_ch23_t1.html"
  // उदाहरण: "c10_hin_ch1_t1.html"
];

function show(id) {
  ['v1','v2','v3','v4'].forEach(v => document.getElementById(v).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  window.scrollTo(0,0);
}

const cg = document.getElementById('c-grid');
for(let i=1; i<=10; i++) {
  cg.innerHTML += `<div class="card"><div><h3>कक्षा ${i} (Class ${i})</h3><span class="badge">${i===10?'बोर्ड स्पेशल':'सभी विषय'}</span></div><button class="btn-p" onclick="openC(${i})">विषय देखें →</button></div>`;
}

function openC(c) {
  document.getElementById('c-title').innerText = `कक्षा ${c} - विषय सूची`;
  const sg = document.getElementById('s-grid');
  sg.innerHTML = "";
  if(c === 10) {
    Object.keys(c10).forEach(s => {
      sg.innerHTML += `<div class="card"><div><h3>${s}</h3><span class="badge">${c10[s].ch.length} पाठ</span></div><button class="btn-p" onclick="openCh10('${s}')">पाठ देखें →</button></div>`;
    });
  } else {
    jrSub.forEach(s => {
      sg.innerHTML += `<div class="card"><div><h3>${s.n}</h3><span class="badge">15 पाठ</span></div><button class="btn-p" onclick="openChJr(${c},'${s.n}','${s.c}')">पाठ देखें →</button></div>`;
    });
  }
  show('v2');
}

function openCh10(s) {
  document.getElementById('s-title').innerText = `कक्षा 10 - ${s}`;
  document.getElementById('back-sub').onclick = () => openC(10);
  const chg = document.getElementById('ch-grid');
  chg.innerHTML = "";
  c10[s].ch.forEach((name, i) => {
    const code = `${c10[s].p}_ch${i+1}`;
    chg.innerHTML += `<div class="ch-item"><div><h4>${name}</h4><span class="soon">5 प्रैक्टिस टेस्ट</span></div><button class="btn-p" onclick="openT('${name}','${code}',()=>openCh10('${s}'))">टेस्ट चुनें →</button></div>`;
  });
  show('v3');
}

function openChJr(c, s, code) {
  document.getElementById('s-title').innerText = `कक्षा ${c} - ${s}`;
  document.getElementById('back-sub').onclick = () => openC(c);
  const chg = document.getElementById('ch-grid');
  chg.innerHTML = "";
  for(let i=1; i<=15; i++) {
    const b = `c${c}_${code}_ch${i}`;
    chg.innerHTML += `<div class="ch-item"><div><h4>पाठ ${i} (Chapter ${i})</h4><span class="soon">5 प्रैक्टिस टेस्ट</span></div><button class="btn-p" onclick="openT('कक्षा ${c} - पाठ ${i}','${b}',()=>openChJr(${c},'${s}','${code}'))">टेस्ट चुनें →</button></div>`;
  }
  show('v3');
}

function openT(title, base, backFn) {
  document.getElementById('ch-title').innerText = title;
  document.getElementById('back-ch').onclick = backFn;
  const tg = document.getElementById('t-grid');
  tg.innerHTML = "";
  for(let t=1; t<=5; t++) {
    const f = `${base}_t${t}.html`;
    const ok = uploaded.includes(f);
    tg.innerHTML += `<div class="card"><h3>Test ${t}</h3><span class="${ok?'live':'soon'}">${ok?'● उपलब्ध (Live)':'कोड: '+f}</span>${ok?`<button class="btn-l" onclick="location.href='${f}'">Start Test →</button>`:`<button class="btn-s" onclick="alert('जल्द उपलब्ध होगा!')">Coming Soon</button>`}</div>`;
  }
  show('v4');
}
</script>
</body>
</html>
